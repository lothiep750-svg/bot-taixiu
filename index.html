<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Tu Tiên Sinh Tồn</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#080b12;
  color:#fff;
  font-family:system-ui,-apple-system,sans-serif;
  touch-action:none;
}

#wrap{
  width:100%;
  height:100%;
  display:flex;
  justify-content:center;
  align-items:center;
}

#game{
  position:relative;
  width:min(100vw,900px);
  height:min(100vh,600px);
  overflow:hidden;
  background:#15231c;
}

canvas{
  width:100%;
  height:100%;
  display:block;
}

#hud{
  position:absolute;
  left:12px;
  top:10px;
  width:235px;
  pointer-events:none;
  text-shadow:0 1px 3px #000;
}

.panel{
  background:#071019c9;
  border:1px solid #ffffff22;
  border-radius:12px;
  padding:9px 11px;
  backdrop-filter:blur(5px);
}

.name{
  font-weight:800;
  font-size:16px;
}

.bar{
  height:9px;
  background:#30343e;
  border-radius:99px;
  overflow:hidden;
  margin:4px 0 6px;
}

.fill{
  height:100%;
  width:100%;
  transition:.2s;
}

.hp{
  background:#e05262;
}

.xp{
  background:#765cff;
}

#enemyHud{
  position:absolute;
  left:50%;
  top:12px;
  transform:translateX(-50%);
  width:230px;
  text-align:center;
  display:none;
  pointer-events:none;
}

#enemyBar{
  height:10px;
  background:#9b3e4b;
  border-radius:99px;
  overflow:hidden;
}

.enemyFill{
  height:100%;
  background:#ed6674;
  width:100%;
}

#tip{
  position:absolute;
  right:12px;
  top:12px;
  font-size:12px;
  opacity:.75;
  background:#071019aa;
  padding:7px 9px;
  border-radius:10px;
}

#controls{
  position:absolute;
  inset:auto 0 0 0;
  height:175px;
  pointer-events:none;
}

#joy{
  position:absolute;
  left:22px;
  bottom:22px;
  width:125px;
  height:125px;
  border-radius:50%;
  background:#ffffff12;
  border:2px solid #ffffff25;
  pointer-events:auto;
}

#stick{
  position:absolute;
  width:54px;
  height:54px;
  border-radius:50%;
  left:33px;
  top:33px;
  background:#ffffff2a;
  border:2px solid #ffffff38;
}

#actions{
  position:absolute;
  right:18px;
  bottom:20px;
  display:flex;
  gap:12px;
  align-items:end;
  pointer-events:auto;
}

.act{
  border:1px solid #ffffff35;
  color:white;
  font-weight:800;
  border-radius:50%;
  width:72px;
  height:72px;
  background:#c44755e8;
  font-size:13px;
  box-shadow:0 6px 15px #0007;
}

.act.skill{
  width:58px;
  height:58px;
  background:#6655d9e8;
}

.act:active{
  transform:scale(.93);
}

#msg{
  position:absolute;
  left:50%;
  bottom:190px;
  transform:translateX(-50%);
  background:#071019dd;
  border:1px solid #ffffff20;
  border-radius:12px;
  padding:8px 13px;
  opacity:0;
  transition:.2s;
  pointer-events:none;
  white-space:nowrap;
}

#levelup{
  position:absolute;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  background:#0008;
  pointer-events:none;
}

#levelup div{
  font-size:38px;
  font-weight:900;
  text-align:center;
  text-shadow:0 4px 15px #000;
}

#start{
  position:absolute;
  inset:0;
  background:#080b12eF;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:5;
}

.startbox{
  text-align:center;
  width:min(88%,420px);
  padding:28px;
  background:#111826;
  border:1px solid #ffffff18;
  border-radius:22px;
}

.startbox h1{
  font-size:32px;
  margin:0 0 8px;
}

.startbox p{
  opacity:.75;
  line-height:1.5;
}

.startbox button{
  border:0;
  background:#6859e8;
  color:white;
  font-weight:800;
  border-radius:13px;
  padding:14px 25px;
  font-size:17px;
}
</style>
</head>

<body>

<div id="wrap">
<div id="game">

<canvas id="c"></canvas>

<!-- HUD -->
<div id="hud" class="panel">

  <div class="name">
    ⚔️ Thiệp — Kiếm Tu
  </div>

  <div>
    Lv.<b id="lv">1</b>
    &nbsp; ⚔️ <b id="dmg">18</b>
    &nbsp; 💰 <b id="gold">0</b>
  </div>

  <div class="bar">
    <div id="hp" class="fill hp"></div>
  </div>

  <div class="small">
    ❤️ <span id="hpText">120/120</span>
  </div>

  <div class="bar">
    <div id="xp" class="fill xp"></div>
  </div>

  <div class="small">
    ✨ EXP <span id="xpText">0/60</span>
  </div>

</div>

<!-- ENEMY HUD -->
<div id="enemyHud" class="panel">

  <b id="enemyName">妖怪</b>

  <div id="enemyBar">
    <div id="enemyFill" class="enemyFill"></div>
  </div>

  <small id="enemyText"></small>

</div>

<div id="tip">
  Joystick để di chuyển • ⚔️ đánh • 🔥 kỹ năng
</div>

<div id="msg"></div>

<!-- CONTROLS -->
<div id="controls">

  <div id="joy">
    <div id="stick"></div>
  </div>

  <div id="actions">

    <button class="act skill" id="skill">
      🔥<br>
      KIẾM KHÍ
    </button>

    <button class="act" id="attack">
      ⚔️<br>
      ĐÁNH
    </button>

  </div>

</div>

<!-- LEVEL UP -->
<div id="levelup">

  <div>
    ✨ ĐỘT PHÁ! ✨
    <br>
    <small style="font-size:18px">
      Cấp <span id="newLv"></span>
    </small>
  </div>

</div>

<!-- START SCREEN -->
<div id="start">

  <div class="startbox">

    <h1>⚔️ TU TIÊN SINH TỒN</h1>

    <p>
      Đánh quái, thu EXP, đột phá cảnh giới
      và sống sót trên bản đồ.
    </p>

    <button id="startBtn">
      BẮT ĐẦU TU LUYỆN
    </button>

  </div>

</div>

</div>
</div>


<script>

/* =========================
   CANVAS
========================= */

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W = 900;
let H = 600;
let scale = 1;

function resize(){

  let r = canvas.getBoundingClientRect();

  scale = window.devicePixelRatio || 1;

  canvas.width = r.width * scale;
  canvas.height = r.height * scale;

  W = r.width;
  H = r.height;

  ctx.setTransform(
    scale,
    0,
    0,
    scale,
    0,
    0
  );
}

addEventListener('resize', resize);

resize();


/* =========================
   WORLD
========================= */

const world = {
  w:1800,
  h:1200
};


/* =========================
   PLAYER
========================= */

const p = {

  x:900,
  y:600,

  r:18,

  level:1,

  hp:120,
  maxHp:120,

  dmg:18,

  exp:0,
  next:60,

  gold:0,

  face:0,

  atk:0,

  skill:0,

  inv:0

};


/* =========================
   ENEMIES
========================= */

let enemies = [];

let particles = [];

let running = false;

let last = 0;

let shake = 0;


/* =========================
   JOYSTICK
========================= */

const joy = {

  active:false,

  id:null,

  x:0,

  y:0

};


/* =========================
   MESSAGE
========================= */

let msgTimer = 0;

function say(t){

  const box = document.getElementById('msg');

  box.textContent = t;

  box.style.opacity = 1;

  msgTimer = 1.5;
}


/* =========================
   SPAWN ENEMY
========================= */

function spawn(){

  const a =
    Math.random() *
    Math.PI *
    2;

  const d =
    280 +
    Math.random() *
    500;

  let x =
    p.x +
    Math.cos(a) *
    d;

  let y =
    p.y +
    Math.sin(a) *
    d;

  x =
    Math.max(
      50,
      Math.min(world.w - 50, x)
    );

  y =
    Math.max(
      50,
      Math.min(world.h - 50, y)
    );


  const lvl =
    Math.max(
      1,
      p.level -
      1 +
      Math.floor(Math.random() * 3)
    );


  const types = [

    [
      '🐺',
      'Linh Lang',
      45,
      12,
      25
    ],

    [
      '👹',
      'Sơn Quỷ',
      70,
      16,
      35
    ],

    [
      '🦂',
      'Độc Hạt',
      90,
      20,
      45
    ],

    [
      '👺',
      'Ma Tu',
      125,
      26,
      65
    ]

  ];


  const t =
    types[
      Math.min(
        types.length - 1,
        Math.floor((lvl - 1) / 2)
      )
    ];


  enemies.push({

    x:x,

    y:y,

    r:
      18 +
      Math.min(8,lvl),

    lvl:lvl,

    name:t[1],

    emoji:t[0],

    hp:
      t[2] *
      (1 + lvl * .18),

    max:
      t[2] *
      (1 + lvl * .18),

    dmg:
      t[3] *
      (1 + lvl * .15),

    exp:
      t[4] +
      lvl * 5,

    hit:0,

    dead:false

  });

}


/* =========================
   INITIAL ENEMIES
========================= */

for(let i=0;i<7;i++){

  spawn();

}


/* =========================
   DRAW
========================= */

function draw(){

  ctx.clearRect(
    0,
    0,
    W,
    H
  );


  ctx.save();

  ctx.translate(
    W / 2 - p.x,
    H / 2 - p.y
  );


  /* GRASS */

  ctx.fillStyle =
    '#173125';

  ctx.fillRect(
    0,
    0,
    world.w,
    world.h
  );


  /* TILE */

  for(
    let x=0;
    x<world.w;
    x+=50
  ){

    for(
      let y=0;
      y<world.h;
      y+=50
    ){

      ctx.strokeStyle =
        ((x/50+y/50)%2
          ? '#1b392a'
          : '#193528');

      ctx.strokeRect(
        x,
        y,
        50,
        50
      );

    }

  }


  /* WATER */

  ctx.fillStyle =
    '#163247';

  ctx.fillRect(
    80,
    100,
    310,
    190
  );

  ctx.fillRect(
    1370,
    840,
    300,
    210
  );


  /* PATH */

  ctx.strokeStyle =
    '#4c4735';

  ctx.lineWidth = 55;

  ctx.beginPath();

  ctx.moveTo(
    0,
    520
  );

  ctx.quadraticCurveTo(
    500,
    450,
    900,
    650
  );

  ctx.quadraticCurveTo(
    1300,
    850,
    1800,
    600
  );

  ctx.stroke();


  /* TREES */

  for(
    let x=70;
    x<world.w;
    x+=110
  ){

    for(
      let y=70;
      y<world.h;
      y+=120
    ){

      if(
        (x+y)%330 < 100
      ){

        ctx.fillStyle =
          '#10251c';

        ctx.beginPath();

        ctx.arc(
          x,
          y,
          24,
          0,
          7
        );

        ctx.fill();


        ctx.fillStyle =
          '#234a31';

        ctx.beginPath();

        ctx.arc(
          x,
          y-12,
          19,
          0,
          7
        );

        ctx.fill();

      }

    }

  }


  /* SHRINE */

  ctx.fillStyle =
    '#6e5941';

  ctx.fillRect(
    820,
    160,
    160,
    90
  );

  ctx.fillStyle =
    '#b83f45';

  ctx.fillRect(
    800,
    145,
    200,
    18
  );


  /* ENEMIES */

  for(
    const e of enemies
  ){

    if(e.dead)
      continue;


    ctx.globalAlpha =
      e.inv ? .5 : 1;

    ctx.font =
      (e.r * 2.3) +
      'px serif';

    ctx.textAlign =
      'center';

    ctx.textBaseline =
      'middle';

    ctx.fillText(
      e.emoji,
      e.x,
      e.y - 4
    );

    ctx.globalAlpha = 1;

  }


  /* PLAYER */

  ctx.save();

  ctx.translate(
    p.x,
    p.y
  );


  /* BODY */

  ctx.fillStyle =
    '#5b43d6';

  ctx.beginPath();

  ctx.arc(
    0,
    0,
    p.r,
    0,
    7
  );

  ctx.fill();


  /* HEAD */

  ctx.fillStyle =
    '#d7b58c';

  ctx.beginPath();

  ctx.arc(
    0,
    -17,
    10,
    0,
    7
  );

  ctx.fill();


  /* HAT */

  ctx.fillStyle =
    '#eee';

  ctx.fillRect(
    -10,
    -27,
    20,
    5
  );


  /* SWORD */

  ctx.strokeStyle =
    '#ddd';

  ctx.lineWidth = 5;

  ctx.beginPath();

  ctx.moveTo(
    9,
    4
  );

  ctx.lineTo(
    25 + p.atk * .7,
    -16
  );

  ctx.stroke();


  ctx.restore();

  ctx.restore();


  drawParticles();

}


/* =========================
   PARTICLES
========================= */

function drawParticles(){

  for(
    const q of particles
  ){

    ctx.globalAlpha =
      Math.max(0,q.life);

    ctx.fillStyle =
      q.color || '#fff';

    ctx.beginPath();

    ctx.arc(
      q.x - p.x + W/2,
      q.y - p.y + H/2,
      q.r,
      0,
      7
    );

    ctx.fill();

  }

  ctx.globalAlpha = 1;

}


/* =========================
   UPDATE
========================= */

function update(dt){

  if(!running)
    return;


  /* MOVEMENT */

  let dx = joy.x;

  let dy = joy.y;

  let len =
    Math.hypot(
      dx,
      dy
    );


  if(len > 1){

    dx /= len;
    dy /= len;

  }


  p.x =
    Math.max(
      25,
      Math.min(
        world.w - 25,
        p.x + dx * 150 * dt
      )
    );


  p.y =
    Math.max(
      25,
      Math.min(
        world.h - 25,
        p.y + dy * 150 * dt
      )
    );


  p.atk =
    Math.max(
      0,
      p.atk - dt * 8
    );


  p.skill =
    Math.max(
      0,
      p.skill - dt
    );


  p.inv =
    Math.max(
      0,
      p.inv - dt
    );


  /* ENEMIES */

  for(
    const e of enemies
  ){

    if(e.dead)
      continue;


    e.hit =
      Math.max(
        0,
        e.hit - dt
      );


    let vx =
      p.x - e.x;

    let vy =
      p.y - e.y;

    let d =
      Math.hypot(
        vx,
        vy
      );


    /* CHASE */

    if(
      d < 360 &&
      d > 48
    ){

      e.x +=
        vx / d *
        48 *
        dt;

      e.y +=
        vy / d *
        48 *
        dt;

    }


    /* ATTACK PLAYER */

    if(
      d < 52 &&
      e.hit <= 0 &&
      p.inv <= 0
    ){

      const dmg =
        Math.max(
          1,
          e.dmg
        );


      p.hp -= dmg;

      e.hit = 1.0;

      p.inv = .25;


      hitFX(
        p.x,
        p.y,
        '#ed6674'
      );


      say(
        'Bạn bị quái tấn công!'
      );


      if(p.hp <= 0){

        p.hp = p.maxHp;

        say(
          '💀 Bạn ngã xuống nhưng đã hồi sinh!'
        );

        p.gold =
          Math.max(
            0,
            p.gold - 15
          );

      }

    }

  }


  /* PARTICLES */

  for(
    const q of particles
  ){

    q.x +=
      q.vx * dt;

    q.y +=
      q.vy * dt;

    q.life -= dt;

    q.r *= .97;

  }


  particles =
    particles.filter(
      q => q.life > 0
    );


  /* SPAWN */

  if(
    enemies.filter(
      e => !e.dead
    ).length < 7
  ){

    spawn();

  }


  shake =
    Math.max(
      0,
      shake - dt * 10
    );


  /* MESSAGE */

  if(msgTimer > 0){

    msgTimer -= dt;

    if(msgTimer <= 0){

      document.getElementById(
        'msg'
      ).style.opacity = 0;

    }

  }


  updateHUD();

}


/* =========================
   HIT EFFECT
========================= */

function hitFX(
  x,
  y,
  color
){

  for(
    let i=0;
    i<10;
    i++
  ){

    let a =
      Math.random() * 7;

    let sp =
      40 +
      Math.random() * 120;


    particles.push({

      x:x,

      y:y,

      vx:
        Math.cos(a) * sp,

      vy:
        Math.sin(a) * sp,

      r:
        3 +
        Math.random() * 3,

      life:.35,

      color:color

    });

  }

}


/* =========================
   NORMAL ATTACK
========================= */

function attack(){

  if(
    !running ||
    p.atk > 0
  )
    return;


  p.atk = .35;

  p.face += .3;


  let target = null;

  let bd = 85;


  for(
    const e of enemies
  ){

    if(e.dead)
      continue;


    let d =
      Math.hypot(
        e.x - p.x,
        e.y - p.y
      );


    if(d < bd){

      bd = d;

      target = e;

    }

  }


  if(!target){

    say(
      'Không có quái trong tầm đánh'
    );

    return;

  }


  /* CRIT */

  let crit =
    Math.random() < .15;


  let d =
    Math.floor(
      p.dmg *
      (crit ? 2 : 1) *
      (.9 + Math.random() * .25)
    );


  target.hp -= d;


  hitFX(
    target.x,
    target.y,
    crit
      ? '#ffd34e'
      : '#fff'
  );


  say(
    (crit
      ? '💥 BẠO KÍCH! '
      : '') +
    '-' +
    d +
    ' HP'
  );


  /* KILL */

  if(
    target.hp <= 0
  ){

    target.dead = true;

    target.fade = 1;


    gain(
      target.exp,
      target.x,
      target.y
    );


    p.gold +=
      Math.ceil(
        target.exp / 3
      );

  }

}


/* =========================
   SKILL
========================= */

function skill(){

  if(
    !running ||
    p.skill > 0
  )
    return;


  p.skill = 4;


  let hit = 0;


  for(
    const e of enemies
  ){

    if(e.dead)
      continue;


    let d =
      Math.hypot(
        e.x - p.x,
        e.y - p.y
      );


    if(d < 150){

      let dam =
        Math.floor(
          p.dmg * 2.2
        );


      e.hp -= dam;

      hit++;


      hitFX(
        e.x,
        e.y,
        '#a88cff'
      );


      if(
        e.hp <= 0
      ){

        e.dead = true;

        e.fade = 1;


        gain(
          e.exp,
          e.x,
          e.y
        );


        p.gold +=
          Math.ceil(
            e.exp / 2
          );

      }

    }

  }


  say(
    hit
      ? '🔥 KIẾM KHÍ quét trúng ' +
        hit +
        ' mục tiêu!'
      : '🔥 Kiếm khí không trúng mục tiêu nào'
  );

}


/* =========================
   EXP / LEVEL
========================= */

function gain(
  x,
  y,
  z
){

  p.exp += x;


  /* EXP PARTICLES */

  for(
    let i=0;
    i<8;
    i++
  ){

    particles.push({

      x:x,

      y:y,

      vx:
        (Math.random() - .5) *
        40,

      vy:
        -40 -
        Math.random() *
        50,

      r:4,

      life:.7,

      color:'#8d7cff'

    });

  }


  /* LEVEL UP */

  while(
    p.exp >= p.next
  ){

    p.exp -= p.next;


    p.level++;


    p.next =
      Math.floor(
        p.next * 1.42
      );


    p.maxHp += 30;

    p.hp =
      p.maxHp;

    p.dmg += 7;


    document.getElementById(
      'newLv'
    ).textContent =
      p.level;


    document.getElementById(
      'levelup'
    ).style.display =
      'flex';


    setTimeout(
      () => {

        document.getElementById(
          'levelup'
        ).style.display =
          'none';

      },
      900
    );


    say(
      '✨ Đột phá cảnh giới! Cấp ' +
      p.level
    );

  }

}


/* =========================
   UPDATE HUD
========================= */

function updateHUD(){

  document.getElementById(
    'lv'
  ).textContent =
    p.level;


  document.getElementById(
    'dmg'
  ).textContent =
    p.dmg;


  document.getElementById(
    'gold'
  ).textContent =
    p.gold;


  document.getElementById(
    'hpText'
  ).textContent =
    Math.ceil(p.hp) +
    '/' +
    p.maxHp;


  document.getElementById(
    'hp'
  ).style.width =
    Math.max(
      0,
      p.hp / p.maxHp * 100
    ) +
    '%';


  document.getElementById(
    'xpText'
  ).textContent =
    p.exp +
    '/' +
    p.next;


  document.getElementById(
    'xp'
  ).style.width =
    p.exp /
    p.next *
    100 +
    '%';


  /* NEAREST ENEMY */

  let near =
    enemies.find(
      e =>
        !e.dead &&
        Math.hypot(
          e.x - p.x,
          e.y - p.y
        ) < 130
    );


  const eh =
    document.getElementById(
      'enemyHud'
    );


  if(near){

    eh.style.display =
      'block';


    document.getElementById(
      'enemyName'
    ).textContent =
      'Lv.' +
      near.lvl +
      ' ' +
      near.name +
      ' ' +
      near.emoji;


    document.getElementById(
      'enemyFill'
    ).style.width =
      near.hp /
      near.max *
      100 +
      '%';


    document.getElementById(
      'enemyText'
    ).textContent =
      Math.ceil(near.hp) +
      '/' +
      Math.ceil(near.max);

  }
  else{

    eh.style.display =
      'none';

  }

}


/* =========================
   GAME LOOP
========================= */

function loop(t){

  let dt =
    Math.min(
      .033,
      (t - last) / 1000 || 0
    );


  last = t;


  update(dt);

  draw();


  requestAnimationFrame(
    loop
  );

}


requestAnimationFrame(
  loop
);


/* =========================
   START
========================= */

document.getElementById(
  'startBtn'
).onclick = () => {

  document.getElementById(

  ).style.display =

/* =========================
   JOYSTICK
========================= */

const joyEl =
  document.getElementById(
    'joy'
  );

const stick =
  document.getElementById(
    'stick'
  );


function joyMove(e){

  let r =
    joyEl.getBoundingClientRect();


  let cx =
    r.left +
    r.width / 2;


  let cy =
    r.top +
    r.height / 2;


  let dx =
    e.clientX - cx;


  let dy =
    e.clientY - cy;


  let m =
    Math.min(
      43,
      Math.hypot(
        dx,
        dy
      )
    );


  if(m){

    let length =
      Math.hypot(
        dx,
        dy
      );


    dx =
      dx / length * m;

    dy =
      dy / length * m;

  }


  stick.style.transform =
    `translate(${dx}px,${dy}px)`;


  joy.x =
    dx / 43;

  joy.y =
    dy / 43;

}


joyEl.onpointerdown =
  e => {

    joy.active = true;

    joyEl.setPointerCapture(
      e.pointerId
    );

    joyMove(e);

  };


joyEl.onpointermove =
  e => {

    if(joy.active)
      joyMove(e);

  };


joyEl.onpointerup =
joyEl.onpointercancel =
  () => {

    joy.active = false;

    joy.x = 0;

    joy.y = 0;

    stick.style.transform =
      'translate(0,0)';

  };

</script>
